<!DOCTYPE html>
<html>

<head>
    <title>Payment Page</title>
</head>

<body>

    <h1>Payment Page</h1>

    <hr>

    <h2>Order Details</h2>

    <p>Book Name: The Great Gatsby</p>
    <p>Price: Rs. 299</p>

    <hr>

    <h2>Customer Details</h2>

    <form>

        Name:
        <input type="text">
        <br><br>

        Email:
        <input type="email">
        <br><br>

        Phone:
        <input type="text">
        <br><br>

        Address:
        <br>
        <textarea rows="4" cols="30"></textarea>

        <hr>

        <h2>Payment Method</h2>

        <input type="radio" name="payment">
        UPI
        <br>

        <input type="radio" name="payment">
        Debit Card
        <br>

        <input type="radio" name="payment">
        Credit Card
        <br>

        <input type="radio" name="payment">
        Cash on Delivery

        <br><br>

        <h3>Card Details</h3>

        Card Number:
        <input type="text">
        <br><br>

        Expiry Date:
        <input type="text">
        <br><br>

        CVV:
        <input type="password">

        <br><br>

        <input type="submit" value="Pay Now">

        <input type="reset" value="Clear">

    </form>

    <hr>

    <p>Thank You for Shopping!</p>

</body>

</html>
